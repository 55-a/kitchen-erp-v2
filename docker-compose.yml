# Локальный запуск: приложение (API + бот) и PostgreSQL.
#   cp .env.example .env   # заполнить BOT_TOKEN, GEMINI_API_KEY, WEBAPP_URL, OWNER_IDS
#   docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kitchen
      POSTGRES_PASSWORD: kitchen
      POSTGRES_DB: kitchen
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitchen -d kitchen"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      # Внутри compose база доступна по имени сервиса db
      DATABASE_URL: postgresql://kitchen:kitchen@db:5432/kitchen
      RUN_BOT_IN_API: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
