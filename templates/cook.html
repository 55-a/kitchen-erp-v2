<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Kuxnya NVGR — Cook</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <!--
    Экран повара — максимально просто, две вкладки:
    🍳 Сегодня  — кто обедает и сколько готовить (по заявкам клиентов + запас),
                  дальше 4 шага по очереди: что на обед → приготовил → отвёз → сколько осталось.
                  Склад повар не ведёт: продукты списываются по рецепту сами.
                  «🛒 Что-то закончилось?» — сообщение закупщику.
    📖 Рецепты  — поиск, «＋ Новый рецепт», у каждого «Изменить» и «В архив» (не удаление),
                  калькулятор «сколько продуктов на N порций».
  -->
  <main class="app">
    <header class="topbar">
      <div>
        <div class="hello">👨‍🍳 <span data-i18n="kitchen_title"></span></div>
        <div class="subtitle" id="today-date"></div>
      </div>
      <div class="balance">
        <div class="label" data-i18n="to_cook"></div>
        <div class="value num" id="to-cook-top">—</div>
      </div>
    </header>

    <div class="tabs">
      <button type="button" data-tab="today" data-i18n="tab_today"></button>
      <button type="button" data-tab="recipes" data-i18n="tab_recipes"></button>
    </div>

    <!-- ===== Сегодня ===== -->
    <section data-panel="today" hidden>
      <div class="card lunch-head" id="lunch-head"><div class="skeleton block"></div></div>
      <div id="steps" class="steps"></div>
      <button type="button" class="btn ghost" id="shortage-btn" style="margin-top:12px" data-i18n="btn_shortage"></button>
    </section>

    <!-- ===== Рецепты ===== -->
    <section data-panel="recipes" hidden class="section">
      <button type="button" class="btn lg" id="new-recipe">＋ <span data-i18n="qa_new_recipe"></span></button>
      <div class="search" style="margin-top:12px"><input id="search" type="search" autocomplete="off" data-i18n-placeholder="search_recipe"></div>
      <div class="chips" id="recipe-cats"></div>
      <div class="recipe-grid" id="recipes">
        <div class="skeleton block"></div><div class="skeleton block"></div>
      </div>
    </section>
  </main>

  <script src="/static/js/i18n.js"></script>
  <script src="/static/js/app.js"></script>
  <script>
    "use strict";
    App.init();
    const { api, fmtMoney, fmtQty, fmtDate, esc, toast, showError, errorText, modal, confirm } = App;
    const t = I18N.t;
    const $ = (id) => document.getElementById(id);
    const RECIPE_CATS = ["first", "main", "garnish", "bakery", "salad", "other"];
    const RECIPE_CAT_ICONS = { first: "🍲", main: "🍛", garnish: "🍚", bakery: "🥐", salad: "🥗", other: "🍽️" };

    let recipes = [];          // актуальные
    let archived = null;       // архив (грузится, когда открыли «📦 Архив»)
    let stock = [];
    let day = null;            // состояние «Сегодня» с сервера
    let recipeCat = "all";
    const photoCache = {};

    // ---------- Иконка блюда по названию (если нет фото) ----------
    // ---------- Иконка блюда по названию (если нет фото) ----------
    const ICONS = [
      [/плов|ош\b|ош\s|osh/i, "🍚"], [/лагм|лапш|мампар|спагет|макарон/i, "🍜"], [/суп|борщ|шовл|мастав|мош\s?хурд|гарох|горох/i, "🍲"],
      [/манты|чучвар|чугвар|пельм|долма|голуб|галибси/i, "🥟"], [/самс|пирож|булоч/i, "🥐"], [/котлет|бифштекс|бештекис|люля|тефтел/i, "🍖"],
      [/кур|товуқ|товук/i, "🍗"], [/димлам|жарко|мохор|мочкичир/i, "🥘"], [/салат/i, "🥗"],
    ];
    const iconFor = (name) => (ICONS.find(([re]) => re.test(name)) || [null, "🍽️"])[1];

    async function photoUrl(id) {
      if (!photoCache[id]) photoCache[id] = URL.createObjectURL(await api(`/api/recipes/${id}/photo`));
      return photoCache[id];
    }

    /** Выбор продукта из справочника сырья (с поиском) или «+ Новый товар» */
    function pickProduct(excludeIds = []) {
      return new Promise((resolve) => {
        let chosen = null;
        const body = document.createElement("div");
        body.className = "form";
        body.innerHTML = `
          <div class="search"><input type="search" data-role="q" autocomplete="off" placeholder="${esc(t("search_product"))}"></div>
          <button type="button" class="btn ghost" data-role="new">＋ ${esc(t("new_product"))}</button>
          <div class="list" data-role="list"></div>`;
        const m = modal({ title: "🥕 " + t("choose_product"), body, onClose: () => resolve(chosen) });
        const draw = () => {
          const q = body.querySelector('[data-role="q"]').value.trim().toLowerCase();
          body.querySelector('[data-role="list"]').innerHTML = stock
            .filter((p) => !excludeIds.includes(p.id) && (!q || p.name.toLowerCase().includes(q)))
            .map((p) => `<div class="list-item tappable" data-pid="${p.id}"><div class="lead">${App.CATEGORY_ICONS[p.category] || "🧺"}</div>
              <div class="grow"><div class="title">${esc(p.name)}</div><div class="hint">${fmtQty(p.quantity)} ${esc(p.unit)} · ${fmtMoney(p.price_per_unit)}</div></div></div>`).join("")
            || App.emptyHtml("🔍", "nothing_found");
        };
        body.addEventListener("input", draw);
        body.addEventListener("click", async (ev) => {
          const it = ev.target.closest("[data-pid]");
          if (it) { chosen = stock.find((p) => String(p.id) === it.dataset.pid); m.close(); return; }
          if (ev.target.closest('[data-role="new"]')) {
            const name = body.querySelector('[data-role="q"]').value.trim();
            const p = await App.createProduct({ name });
            if (p) { await loadStock(); chosen = stock.find((x) => x.id === p.id) || p; m.close(); }
          }
        });
        draw();
      });
    }

    // ---------- Редактор техкарты: создать / изменить ----------
    async function openRecipeEditor(r = null) {
      if (!stock.length) await loadStock();
      const body = document.createElement("div");
      body.className = "form";
      let rows = r ? r.ingredients.map((i) => ({ product_id: i.product_id, quantity: i.quantity, unit: i.unit })) : [];
      let photoBlob = null;
      body.innerHTML = `
        <div class="photo-pick" data-role="photo">
          <div class="recipe-hero small" data-role="preview"><span>📷</span></div>
          <button type="button" class="btn secondary" data-role="photo-btn">📷 ${esc(t(r && r.has_photo ? "change_photo" : "add_photo"))}</button>
          <input type="file" accept="image/*" hidden data-role="photo-file">
        </div>
        <div class="field"><label>${esc(t("dish_name"))}</label><input name="name" maxlength="255" value="${esc(r ? r.name : "")}"></div>
        <div class="row">
          <div class="field"><label>${esc(t("category"))}</label>
            <select name="category">${RECIPE_CATS.map((c) => `<option value="${c}" ${r && r.category === c ? "selected" : ""}>${RECIPE_CAT_ICONS[c]} ${esc(t("rcat_" + c))}</option>`).join("")}</select></div>
          <div class="field"><label>${esc(t("shelf_life_hours"))}</label><input name="shelf" type="number" inputmode="numeric" min="1" max="720" value="${r ? r.shelf_life_hours : 24}"></div>
        </div>
        <div class="field"><label>${esc(t("base_yield_label"))}</label><input name="yield" type="number" inputmode="numeric" min="1" step="any" value="${r ? r.base_yield : 100}"></div>
        <div>
          <div class="card-head" style="margin:4px 0 6px"><h3>${esc(t("ingredients"))}</h3><span class="hint" data-role="cost"></span></div>
          <div data-role="rows" class="usage-list"></div>
          <button type="button" class="btn ghost" data-role="add" style="margin-top:8px">＋ ${esc(t("add_ingredient"))}</button>
        </div>
        ${r ? `<p class="small muted">${esc(t("version_hint", { n: r.version }))}</p>` : ""}`;

      const unitsFor = (p) => {
        const base = { kg: ["kg", "g"], g: ["g", "kg"], l: ["l", "ml"], ml: ["ml", "l"] }[p.unit] || [p.unit];
        return base;
      };
      function drawRows() {
        let cost = 0;
        body.querySelector('[data-role="rows"]').innerHTML = rows.map((row, idx) => {
          const p = stock.find((x) => x.id === row.product_id) || { name: "?", unit: row.unit, price_per_unit: 0 };
          const factor = row.unit === "g" && p.unit === "kg" || row.unit === "ml" && p.unit === "l" ? 0.001
            : row.unit === "kg" && p.unit === "g" || row.unit === "l" && p.unit === "ml" ? 1000 : 1;
          cost += (parseFloat(row.quantity) || 0) * factor * (p.price_per_unit || 0);
          return `
            <div class="usage-row">
              <div class="u-name"><b>${esc(p.name)}</b><div class="small muted">${fmtMoney(p.price_per_unit)} / ${esc(p.unit)}</div></div>
              <div class="u-input">
                <input type="number" inputmode="decimal" min="0" step="any" data-q="${idx}" value="${row.quantity}">
                <select data-u="${idx}">${unitsFor(p).map((u) => `<option value="${u}" ${u === row.unit ? "selected" : ""}>${esc(t("unit_" + u) || u)}</option>`).join("")}</select>
                <button type="button" class="icon-btn small" data-del="${idx}" aria-label="delete">✕</button>
              </div>
            </div>`;
        }).join("") || `<div class="empty">${esc(t("no_ingredients"))}</div>`;
        const y = parseFloat(body.querySelector('[name="yield"]').value) || 1;
        body.querySelector('[data-role="cost"]').textContent = rows.length ? `${fmtMoney(cost)} · ${fmtMoney(cost / y)} / ${t("portion_one")}` : "";
      }
      body.addEventListener("input", (ev) => {
        if (ev.target.dataset.q !== undefined) { rows[ev.target.dataset.q].quantity = ev.target.value; }
        if (ev.target.dataset.q !== undefined || ev.target.name === "yield") {
          // обновляем только итог, не перерисовывая поля (чтобы не терять фокус)
          let cost = 0;
          rows.forEach((row) => {
            const p = stock.find((x) => x.id === row.product_id) || { price_per_unit: 0, unit: row.unit };
            const factor = row.unit === "g" && p.unit === "kg" || row.unit === "ml" && p.unit === "l" ? 0.001 : row.unit === "kg" && p.unit === "g" || row.unit === "l" && p.unit === "ml" ? 1000 : 1;
            cost += (parseFloat(row.quantity) || 0) * factor * (p.price_per_unit || 0);
          });
          const y = parseFloat(body.querySelector('[name="yield"]').value) || 1;
          body.querySelector('[data-role="cost"]').textContent = rows.length ? `${fmtMoney(cost)} · ${fmtMoney(cost / y)} / ${t("portion_one")}` : "";
        }
      });
      body.addEventListener("change", (ev) => {
        if (ev.target.dataset.u !== undefined) { rows[ev.target.dataset.u].unit = ev.target.value; drawRows(); }
      });
      body.addEventListener("click", async (ev) => {
        const del = ev.target.closest("[data-del]");
        if (del) { rows.splice(Number(del.dataset.del), 1); drawRows(); return; }
        if (ev.target.closest('[data-role="add"]')) {
          const p = await pickProduct(rows.map((x) => x.product_id));
          if (p) { rows.push({ product_id: p.id, quantity: "", unit: p.unit }); drawRows(); }
        }
        if (ev.target.closest('[data-role="photo-btn"]')) body.querySelector('[data-role="photo-file"]').click();
      });
      body.querySelector('[data-role="photo-file"]').addEventListener("change", async (ev) => {
        const f = ev.target.files[0];
        if (!f) return;
        photoBlob = await compressImage(f);
        body.querySelector('[data-role="preview"]').innerHTML = `<img src="${URL.createObjectURL(photoBlob)}" alt="">`;
      });
      drawRows();
      if (r && r.has_photo) {
        try { body.querySelector('[data-role="preview"]').innerHTML = `<img src="${await photoUrl(r.id)}" alt="">`; } catch (e) { /* без фото */ }
      }

      modal({
        title: r ? "✏️ " + r.name : "➕ " + t("qa_new_recipe"),
        body,
        actions: [
          { label: t("cancel"), kind: "secondary" },
          { label: "💾 " + t("save"), onClick: async () => {
            const name = body.querySelector('[name="name"]').value.trim();
            const valid = rows.filter((x) => parseFloat(x.quantity) > 0);
            if (name.length < 2) { body.querySelector('[name="name"]').classList.add("invalid"); toast(t("dish_name_required"), "error"); return false; }
            if (!valid.length) { toast(t("no_ingredients"), "error"); return false; }
            const payload = {
              name, category: body.querySelector('[name="category"]').value,
              shelf_life_hours: parseInt(body.querySelector('[name="shelf"]').value, 10) || 24,
              base_yield: parseFloat(body.querySelector('[name="yield"]').value) || 1,
              ingredients: valid.map((x) => ({ product_id: x.product_id, quantity: parseFloat(x.quantity), unit: x.unit })),
            };
            const saved = r ? await api(`/api/recipes/${r.id}`, { method: "PUT", json: payload }) : await api("/api/recipes", { json: payload });
            if (photoBlob) {
              const form = new FormData();
              form.append("file", photoBlob, "photo.jpg");
              await api(`/api/recipes/${saved.id}/photo`, { form });
              delete photoCache[saved.id];
            }
            toast(r && saved.version > r.version ? t("recipe_saved_version", { n: saved.version }) : t("saved"));
            await loadRecipes();
          } },
        ],
      });
    }

    /** Сжимаем фото на телефоне до 1280px JPEG — быстро грузится и мало весит */
    function compressImage(file, maxSide = 1280) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          const k = Math.min(1, maxSide / Math.max(img.width, img.height));
          const c = document.createElement("canvas");
          c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          c.toBlob((b) => (b ? resolve(b) : reject(new Error("photo"))), "image/jpeg", 0.82);
        };
        img.onerror = reject;
        img.src = URL.createObjectURL(file);
      });
    }

    // ---------- Загрузка ----------
    async function loadStock() {
      try { stock = await api("/api/stock"); } catch (e) { stock = []; }
    }
    async function loadRecipes() {
      try {
        recipes = (await api("/api/recipes")).map(normRecipe);
        archived = null;
        if (recipeCat === "archive") await loadArchive();
        renderRecipes();
      } catch (e) { $("recipes").innerHTML = `<div class="error-box" style="grid-column:1/-1">${esc(errorText(e))}</div>`; }
    }
    async function loadArchive() {
      archived = (await api("/api/recipes", { query: { archived: true } })).map(normRecipe);
    }
    const normRecipe = (r) => ({ shelf_life_hours: 24, version: 1, has_photo: false, ...r,
      category: r.category || "main", shelf_life_hours: r.shelf_life_hours || 24, version: r.version || 1 });

    async function loadDay() {
      try { day = await api("/api/cook/day"); renderDay(); }
      catch (e) { $("lunch-head").innerHTML = `<div class="error-box">${esc(errorText(e))}</div>`; $("steps").innerHTML = ""; }
    }

    // ================================================================ Сегодня
    /** Шапка: кто обедает (по заявкам или «как обычно») и сколько готовить */
    function renderHead() {
      $("today-date").textContent = `${t("wd_" + day.weekday) || ""} · ${fmtDate(day.date)}`;
      $("to-cook-top").textContent = day.to_cook ? fmtQty(day.to_cook) : "—";
      const people = day.people.map((p) => `
        <div class="lh-row"><span>${esc(p.client)}</span>
          <span><b>${fmtQty(p.portions)}</b> ${esc(t("people_short"))}
          <span class="badge ${p.ordered ? "ok" : ""}">${esc(t(p.ordered ? "by_order" : "by_usual"))}</span></span></div>`).join("");
      $("lunch-head").innerHTML = `
        <div class="card-head" style="margin:0 0 6px"><h2>👥 ${esc(t("lunch_people"))}</h2></div>
        ${people || `<p class="small muted">${esc(t("no_people"))}</p>`}
        ${day.to_cook ? `<div class="total-big" style="margin-top:10px"><span class="label">🍳 ${esc(t("to_cook"))}
            <span class="small muted" style="display:block">${esc(t("to_cook_hint", { n: fmtQty(day.people_total), p: day.buffer_pct }))}</span></span>
          <span class="value">${fmtQty(day.to_cook)} <small>${esc(t("portions_short"))}</small></span></div>` : ""}`;
    }

    const STEPS = ["dishes", "cook", "deliver", "leftover"];
    // Какой шаг отменит «Назад» на текущем этапе
    const UNDO_WHAT = { cook: "undo_what_dishes", deliver: "undo_what_cooked", leftover: "undo_what_delivered", done: "undo_what_left" };

    /** Число с большими кнопками − и + (для повара — почти ничего не печатать) */
    function stepper(name, value) {
      return `<div class="stepper" data-stepper="${name}">
        <button type="button" class="st-btn" data-d="-1" aria-label="minus">−</button>
        <input type="number" inputmode="numeric" min="0" step="1" name="${name}" value="${value}">
        <button type="button" class="st-btn" data-d="1" aria-label="plus">+</button>
      </div>`;
    }

    function stepBody(step) {
      const dishes = day.dishes.map((d) => `<span class="dish-chip">${iconFor(d.recipe)} ${esc(d.recipe)}</span>`).join("");
      if (step === "dishes") {
        return `<p class="small muted">${esc(t("step_dishes_hint"))}</p>
          ${dishes ? `<div class="dish-list">${dishes}</div>` : ""}
          <button type="button" class="btn lg" data-do="dishes">${esc(t(day.dishes.length ? "btn_change_dishes" : "btn_choose_dishes"))}</button>`;
      }
      if (step === "cook") {
        return `<div class="dish-list">${dishes}<button type="button" class="link-btn" data-do="dishes">${esc(t("btn_change_dishes"))}</button></div>
          ${stepper("cooked", day.to_cook || 1)}
          <p class="small muted center">${esc(t("step_cook_hint"))}</p>
          <button type="button" class="btn lg success" data-do="cooked">${esc(t("btn_cooked"))}</button>`;
      }
      if (step === "deliver") {
        const rows = day.people.map((p, i) => `
          <div class="deliver-row"><div class="grow"><b>${esc(p.client)}</b>
            <div class="small muted">${esc(t(p.ordered ? "by_order" : "by_usual"))}: ${fmtQty(p.portions)}</div></div>
            ${stepper("c" + i, Math.min(p.portions, day.remaining))}</div>`).join("");
        return `<p class="small muted">${esc(t("step_deliver_hint"))}</p>${rows}
          <div class="total-line">${esc(t("total"))}: <b data-role="dtotal">—</b> / ${fmtQty(day.cooked)}</div>
          <button type="button" class="btn lg success" data-do="delivered">${esc(t("btn_delivered"))}</button>`;
      }
      if (step === "leftover") {
        return `<p class="small muted">${esc(t("step_left_hint"))}</p>
          ${stepper("left", day.remaining)}
          <button type="button" class="btn lg success" data-do="leftover">${esc(t("btn_left_save"))}</button>`;
      }
      return "";
    }

    /** Короткий итог уже сделанного шага */
    function stepDone(step) {
      if (step === "dishes") return day.dishes.map((d) => esc(d.recipe)).join(" + ");
      if (step === "cook") return `${fmtQty(day.cooked)} ${esc(t("portions_short"))}`;
      if (step === "deliver") return day.delivered.map((d) => `${esc(d.client)}: ${fmtQty(d.portions)}`).join(" · ");
      if (step === "leftover") return `${fmtQty(day.leftover)} ${esc(t("portions_short"))}`;
      return "";
    }

    function renderDay() {
      renderHead();
      const current = day.step === "done" ? STEPS.length : STEPS.indexOf(day.step);
      const titles = { dishes: "step_dishes", cook: "step_cook", deliver: "step_deliver", leftover: "step_left" };
      let html = STEPS.map((s, i) => {
        const state = i < current ? "done" : i === current ? "active" : "locked";
        return `
          <div class="step ${state}">
            <div class="step-head">
              <span class="step-num">${state === "done" ? "✓" : i + 1}</span>
              <div class="grow"><div class="step-title">${esc(t(titles[s]))}</div>
                ${state === "done" ? `<div class="small muted">${stepDone(s)}</div>` : ""}</div>
            </div>
            ${state === "active" ? `<div class="step-body">${stepBody(s)}</div>` : ""}
          </div>`;
      }).join("");
      if (day.step === "done") {
        html = `<div class="card day-done"><div class="dd-title">${esc(t("day_done"))}</div>
          <div class="small muted">${esc(t("day_summary", { cooked: fmtQty(day.cooked), given: fmtQty(day.delivered_total), left: fmtQty(day.leftover) }))}</div></div>` + html;
      }
      // «Назад» видно всегда, когда есть что отменить, и написано, что именно отменится
      if (day.can_undo) html += `<button type="button" class="btn secondary undo-btn" data-do="undo">↩ ${esc(t("undo_step", { what: t(UNDO_WHAT[day.step]) }))}</button>`;
      $("steps").innerHTML = html;
      updateDeliverTotal();
    }

    function updateDeliverTotal() {
      const el = $("steps").querySelector('[data-role="dtotal"]');
      if (!el) return;
      const sum = day.people.reduce((a, _, i) => a + (parseFloat(($("steps").querySelector(`[name="c${i}"]`) || {}).value) || 0), 0);
      el.textContent = fmtQty(sum);
      el.className = sum > day.remaining ? "danger" : "";
    }

    $("steps").addEventListener("click", async (ev) => {
      const d = ev.target.closest("[data-d]");
      if (d) {
        const input = d.parentElement.querySelector("input");
        input.value = Math.max(0, (parseInt(input.value, 10) || 0) + Number(d.dataset.d));
        updateDeliverTotal();
        return;
      }
      const b = ev.target.closest("[data-do]");
      if (!b) return;
      const act = b.dataset.do;
      if (act === "dishes") return pickDishes();
      if (act === "undo") {
        if (!(await confirm(esc(t("undo_confirm_step", { what: t(UNDO_WHAT[day.step]) })), { icon: "↩", okLabel: t("undo_ok") }))) return;
        return send(b, () => api("/api/cook/day/undo", { method: "POST" }), "undone");
      }
      const val = (name) => parseInt(($("steps").querySelector(`[name="${name}"]`) || {}).value, 10) || 0;
      if (act === "cooked") {
        const n = val("cooked");
        if (!(n > 0)) return toast(t("quantity_required"), "error");
        return send(b, () => api("/api/cook/day/cooked", { json: { portions: n } }), "cooked_ok", { n });
      }
      if (act === "delivered") {
        const items = day.people.map((p, i) => ({ client: p.client, portions: val("c" + i) }));
        const n = items.reduce((a, x) => a + x.portions, 0);
        if (!n) return toast(t("quantity_required"), "error");
        if (n > day.remaining) return toast(t("err_not_enough_portions"), "error");
        return send(b, () => api("/api/cook/day/delivered", { json: { items } }), "delivered_ok", { n });
      }
      if (act === "leftover") {
        return send(b, () => api("/api/cook/day/leftover", { json: { portions: val("left") } }), "left_ok");
      }
    });
    $("steps").addEventListener("input", updateDeliverTotal);

    /** Кнопка блокируется на время запроса; ответ сервера — новое состояние дня */
    async function send(btn, fn, okKey, params) {
      btn.disabled = true;
      try { day = await fn(); renderDay(); toast(t(okKey, params)); App.haptic && App.haptic("success"); }
      catch (e) { showError(e); }
      finally { btn.disabled = false; }
    }

    /** «Что на обед?» — нажать на блюда (можно несколько) */
    function pickDishes() {
      const chosen = new Set(day.dishes.map((d) => d.recipe_id));
      const locked = new Set(day.dishes.filter((d) => d.batch_id).map((d) => d.recipe_id));
      const body = document.createElement("div");
      body.className = "form";
      body.innerHTML = `
        <p class="small muted">${esc(t("dishes_pick_hint"))}</p>
        <div class="search"><input type="search" data-role="q" autocomplete="off" placeholder="${esc(t("search_recipe"))}"></div>
        <div class="list" data-role="list"></div>`;
      const draw = () => {
        const q = body.querySelector('[data-role="q"]').value.trim().toLowerCase();
        const list = recipes.filter((r) => !q || r.name.toLowerCase().includes(q))
          .sort((a, b) => (chosen.has(b.id) - chosen.has(a.id)) || a.name.localeCompare(b.name));
        body.querySelector('[data-role="list"]').innerHTML = list.map((r) => `
          <div class="list-item tappable pick ${chosen.has(r.id) ? "picked" : ""}" data-rid="${r.id}">
            <div class="lead">${iconFor(r.name)}</div><div class="grow"><div class="title">${esc(r.name)}</div></div>
            <span class="pick-mark">${chosen.has(r.id) ? "✅" : "⬜"}</span></div>`).join("") || App.emptyHtml("🔍", "nothing_found");
      };
      body.addEventListener("input", draw);
      body.addEventListener("click", (ev) => {
        const it = ev.target.closest("[data-rid]");
        if (!it) return;
        const id = Number(it.dataset.rid);
        if (locked.has(id)) return;
        chosen.has(id) ? chosen.delete(id) : chosen.add(id);
        draw();
      });
      draw();
      modal({ title: "🍽 " + t("step_dishes"), body, actions: [
        { label: t("cancel"), kind: "secondary" },
        { label: "💾 " + t("save"), onClick: async () => {
          try { day = await api("/api/cook/day/dishes", { method: "PUT", json: { recipe_ids: [...chosen] } }); renderDay(); }
          catch (e) { showError(e); return false; }
        } },
      ] });
    }

    /** «🛒 Что-то закончилось?» — отметить продукты, закупщик получит сообщение */
    async function openShortage() {
      if (!stock.length) await loadStock();
      const picked = new Set();
      const body = document.createElement("div");
      body.className = "form";
      body.innerHTML = `
        <p class="small muted">${esc(t("shortage_hint"))}</p>
        <div class="search"><input type="search" data-role="q" autocomplete="off" placeholder="${esc(t("search_product"))}"></div>
        <div class="chips wrap" data-role="list"></div>
        <div class="field"><textarea data-role="other" rows="2" maxlength="300" placeholder="${esc(t("shortage_other"))}"></textarea></div>`;
      const draw = () => {
        const q = body.querySelector('[data-role="q"]').value.trim().toLowerCase();
        body.querySelector('[data-role="list"]').innerHTML = stock
          .filter((p) => picked.has(p.name) || !q || p.name.toLowerCase().includes(q))
          .map((p) => `<button type="button" class="chip ${picked.has(p.name) ? "active" : ""}" data-name="${esc(p.name)}">${App.CATEGORY_ICONS[p.category] || "🧺"} ${esc(p.name)}</button>`).join("");
      };
      body.addEventListener("input", (ev) => { if (ev.target.dataset.role === "q") draw(); });
      body.addEventListener("click", (ev) => {
        const c = ev.target.closest("[data-name]");
        if (!c) return;
        picked.has(c.dataset.name) ? picked.delete(c.dataset.name) : picked.add(c.dataset.name);
        draw();
      });
      draw();
      modal({ title: "🛒 " + t("shortage_title"), body, actions: [
        { label: t("cancel"), kind: "secondary" },
        { label: t("shortage_send"), onClick: async () => {
          const other = body.querySelector('[data-role="other"]').value.trim();
          const items = [...picked];
          if (other) items.push(other);
          if (!items.length) { toast(t("shortage_pick"), "error"); return false; }
          try { await api("/api/cook/shortage", { json: { items } }); toast(t("shortage_sent")); }
          catch (e) { showError(e); return false; }
        } },
      ] });
    }
    $("shortage-btn").addEventListener("click", openShortage);

    // ================================================================ Рецепты
    function renderCats() {
      $("recipe-cats").innerHTML = [["all", "🍽️ " + t("all")]]
        .concat(RECIPE_CATS.filter((c) => recipes.some((r) => r.category === c)).map((c) => [c, `${RECIPE_CAT_ICONS[c]} ${t("rcat_" + c)}`]))
        .concat([["archive", t("chip_archive")]])
        .map(([c, label]) => `<button type="button" class="chip ${c === recipeCat ? "active" : ""}" data-cat="${c}">${esc(label)}</button>`).join("");
    }
    $("recipe-cats").addEventListener("click", async (ev) => {
      const b = ev.target.closest("[data-cat]");
      if (!b) return;
      recipeCat = b.dataset.cat;
      if (recipeCat === "archive" && !archived) {
        try { await loadArchive(); } catch (e) { showError(e); }
      }
      renderRecipes();
    });

    function renderRecipes() {
      renderCats();
      const q = $("search").value.trim().toLowerCase();
      const source = recipeCat === "archive" ? (archived || []) : recipes;
      const list = source.filter((r) => (!q || r.name.toLowerCase().includes(q)) && (recipeCat === "all" || recipeCat === "archive" || r.category === recipeCat));
      if (!list.length) {
        $("recipes").innerHTML = `<div style="grid-column:1/-1">${App.emptyHtml(recipeCat === "archive" ? "📦" : "🔍", recipeCat === "archive" && !q ? "archive_empty" : "nothing_found")}</div>`;
        return;
      }
      $("recipes").innerHTML = list.map((r, idx) => `
        <button type="button" class="recipe-card ${r.archived ? "is-archived" : ""}" data-id="${r.id}" style="animation-delay:${Math.min(idx, 12) * 0.03}s">
          <div class="emoji" data-photo="${r.has_photo ? r.id : ""}">${iconFor(r.name)}</div>
          <div class="name">${esc(r.name)}</div>
          <div class="meta">${RECIPE_CAT_ICONS[r.category] || ""} ${esc(t("rcat_" + r.category))}</div>
        </button>`).join("");
      $("recipes").querySelectorAll("[data-photo]").forEach(async (el) => {
        if (!el.dataset.photo) return;
        try { el.innerHTML = `<img src="${await photoUrl(el.dataset.photo)}" alt="">`; el.classList.add("has-photo"); } catch (e) { /* оставим иконку */ }
      });
    }
    $("search").addEventListener("input", renderRecipes);
    $("recipes").addEventListener("click", (ev) => {
      const card = ev.target.closest(".recipe-card");
      if (!card) return;
      const r = recipes.concat(archived || []).find((x) => String(x.id) === card.dataset.id);
      if (r) openRecipe(r);
    });
    $("new-recipe").addEventListener("click", () => openRecipeEditor(null));

    /** Карточка рецепта: фото, калькулятор «на N порций», «Изменить», «В архив» / «Вернуть» */
    async function openRecipe(r) {
      const body = document.createElement("div");
      body.className = "form";
      const start = (day && day.to_cook) || r.base_yield || 1;
      body.innerHTML = `
        <div class="recipe-hero" data-role="hero"><span>${iconFor(r.name)}</span></div>
        <div class="field"><label>${esc(t("calc_for"))}</label>${stepper("calc", start)}
          <div class="small muted center">${esc(t("calc_hint"))}</div></div>
        <div class="table-wrap"><table>
          <thead><tr><th>${esc(t("product"))}</th><th class="right" data-role="per">—</th></tr></thead>
          <tbody data-role="rows"></tbody>
        </table></div>
        <div class="small muted">${RECIPE_CAT_ICONS[r.category] || ""} ${esc(t("rcat_" + r.category))} · ${esc(t("shelf_life"))}: ${r.shelf_life_hours} ${esc(t("hours_short"))}</div>`;
      const input = body.querySelector('[name="calc"]');
      const nice = (v) => (v >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
      const draw = () => {
        const n = Math.max(0, parseFloat(input.value) || 0);
        body.querySelector('[data-role="per"]').textContent = t("per_portions", { n: fmtQty(n) });
        body.querySelector('[data-role="rows"]').innerHTML = r.ingredients.map((i) => {
          let q = (i.quantity * n) / (r.base_yield || 1), unit = i.unit;
          if (unit === "g" && q >= 1000) { q /= 1000; unit = "kg"; }
          if (unit === "ml" && q >= 1000) { q /= 1000; unit = "l"; }
          return `<tr><td>${esc(i.product)}</td><td class="right num"><b>${fmtQty(nice(q))}</b> ${esc(t("unit_" + unit) || unit)}</td></tr>`;
        }).join("") || `<tr><td colspan="2" class="muted">${esc(t("no_ingredients"))}</td></tr>`;
      };
      body.addEventListener("input", draw);
      body.addEventListener("click", (ev) => {
        const d = ev.target.closest("[data-d]");
        if (!d) return;
        input.value = Math.max(1, (parseInt(input.value, 10) || 0) + Number(d.dataset.d) * 10);
        draw();
      });
      draw();
      const actions = r.archived
        ? [{ label: t("rec_restore"), onClick: () => setArchived(r, false) }]
        : [
          { label: t("rec_archive"), kind: "secondary", onClick: async () => {
            if (!(await confirm(esc(t("rec_archive_confirm", { name: r.name })), { icon: "📦" }))) return false;
            return setArchived(r, true);
          } },
          { label: "✏️ " + t("edit"), onClick: () => { setTimeout(() => openRecipeEditor(r), 250); } },
        ];
      modal({ title: r.name, body, actions });
      if (r.has_photo) {
        try { body.querySelector('[data-role="hero"]').innerHTML = `<img src="${await photoUrl(r.id)}" alt="">`; } catch (e) { /* без фото */ }
      }
    }

    async function setArchived(r, value) {
      try {
        await api(`/api/recipes/${r.id}/archive`, { json: { archived: value } });
        toast(t(value ? "rec_archived_ok" : "rec_restored_ok"));
        await loadRecipes();
      } catch (e) { showError(e); return false; }
    }

    App.initTabs((name) => { if (name === "recipes" && !recipes.length) loadRecipes(); });
    loadDay();
    loadRecipes();
  </script>
</body>
</html>
