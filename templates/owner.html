<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Kuxnya NVGR — Owner</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Chart.js с CDN; если он не загрузится, карточки и клиенты всё равно работают -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <!--
    Главный экран владельца.
    Исправления из технического обзора:
     - запросы к API только по относительным путям /api/... (App.api в static/js/app.js);
     - response.ok проверяется ДО парсинга JSON: 403/500 показываются текстом ошибки, а не нулевой выручкой;
     - список клиентов берётся из /api/stats (by_client) и /api/clients — «Загрузка…» не зависает.
  -->
  <main class="app">

    <!-- ===== Верхняя панель: приветствие и баланс клиентов ===== -->
    <header class="topbar">
      <div>
        <div class="hello" id="hello">Kuxnya NVGR</div>
        <div class="subtitle" data-i18n="owner_panel"></div>
      </div>
      <div class="balance tappable" data-explain="balance">
        <div class="label" data-i18n="balance_label"></div>
        <div class="value num" id="balance">—</div>
      </div>
    </header>

    <!-- ===== Период ===== -->
    <div class="chips" id="period-chips">
      <button type="button" class="chip active" data-period="all" data-i18n="period_all"></button>
      <button type="button" class="chip" data-period="month" data-i18n="period_month"></button>
      <button type="button" class="chip" data-period="year" data-i18n="period_year"></button>
      <button type="button" class="chip" data-period="custom" data-i18n="period_custom"></button>
    </div>

    <div id="stats-error" class="error-box" hidden></div>

    <!-- ===== 4 KPI: выручка, прибыль, маржа, долги клиентов (2x2) ===== -->
    <section class="kpi-grid" id="kpis">
      <div class="kpi tappable" data-explain="revenue">
        <div class="icon">💰</div>
        <div class="label" data-i18n="revenue"></div>
        <div class="value" id="k-revenue"><div class="skeleton line"></div></div>
        <div class="sub" id="k-revenue-sub"></div>
      </div>
      <div class="kpi success tappable" data-explain="profit">
        <div class="icon">📈</div>
        <div class="label" data-i18n="profit"></div>
        <div class="value" id="k-profit"><div class="skeleton line"></div></div>
        <div class="sub" id="k-profit-sub"></div>
      </div>
      <div class="kpi info tappable" data-explain="margin">
        <div class="icon">🎯</div>
        <div class="label" data-i18n="margin"></div>
        <div class="value" id="k-margin"><div class="skeleton line"></div></div>
        <div class="sub" data-i18n="margin_hint"></div>
      </div>
      <div class="kpi warning tappable" data-explain="debts">
        <div class="icon">🧾</div>
        <div class="label" data-i18n="kpi_debts"></div>
        <div class="value" id="k-debts"><div class="skeleton line"></div></div>
        <div class="sub" id="k-debts-sub"></div>
      </div>
    </section>

    <!-- Дополнительные показатели -->
    <section class="mini-stats">
      <div class="mini-stat tappable" data-explain="portions"><div class="label" data-i18n="portions"></div><div class="value" id="m-portions">—</div></div>
      <div class="mini-stat tappable" data-explain="cost"><div class="label" data-i18n="cost"></div><div class="value" id="m-cost">—</div></div>
      <div class="mini-stat tappable" data-explain="purchases"><div class="label" data-i18n="purchases_total"></div><div class="value" id="m-purchases">—</div></div>
      <div class="mini-stat tappable" data-explain="stock"><div class="label" data-i18n="stock_value"></div><div class="value" id="m-stock">—</div></div>
      <div class="mini-stat tappable wide" data-explain="writeoffs"><div class="label" data-i18n="writeoffs_staff"></div><div class="value" id="m-writeoffs">—</div></div>
    </section>

    <!-- ===== Быстрые действия ===== -->
    <section class="quick-actions four">
      <button type="button" class="quick-action" id="qa-operation"><span class="qa-icon">➕</span><span data-i18n="qa_operation"></span></button>
      <button type="button" class="quick-action" id="qa-export"><span class="qa-icon">⬇️</span><span data-i18n="qa_export"></span></button>
      <button type="button" class="quick-action" id="qa-team"><span class="qa-icon">👥</span><span data-i18n="qa_team"></span></button>
      <button type="button" class="quick-action" id="qa-settings"><span class="qa-icon">⚙️</span><span data-i18n="qa_settings"></span></button>
    </section>

    <!-- ===== План / факт / прогноз на месяц ===== -->
    <section class="card" id="plan-card">
      <div class="card-head">
        <h2>🎯 <span data-i18n="plan_title"></span></h2>
        <div class="month-nav">
          <button type="button" class="icon-btn" id="plan-prev" aria-label="prev">‹</button>
          <span id="plan-month" class="month-label">—</span>
          <button type="button" class="icon-btn" id="plan-next" aria-label="next">›</button>
        </div>
      </div>
      <div id="plan-body"><div class="skeleton block"></div></div>
      <div class="row" style="margin-top:12px">
        <button type="button" class="btn secondary" id="plan-edit">✏️ <span data-i18n="plan_set"></span></button>
        <button type="button" class="btn ghost" id="plan-how">ⓘ <span data-i18n="plan_how"></span></button>
      </div>
    </section>

    <!-- ===== График выручки по месяцам (на всю ширину) ===== -->
    <section class="card">
      <div class="card-head"><h2 data-i18n="chart_revenue"></h2><span class="hint" id="chart-period"></span></div>
      <div class="chart-box"><canvas id="chart-revenue"></canvas></div>
    </section>

    <!-- ===== Прибыль и себестоимость ===== -->
    <section class="card">
      <div class="card-head"><h2 data-i18n="chart_profit_cost"></h2></div>
      <div class="chart-box small"><canvas id="chart-profit"></canvas></div>
    </section>

    <!-- ===== Клиенты: карточки с балансом ===== -->
    <section class="section" id="clients-section">
      <div class="section-title"><span data-i18n="clients_title"></span><span class="badge info" id="clients-count">—</span></div>
      <div class="client-grid" id="clients">
        <div class="skeleton block"></div>
        <div class="skeleton block"></div>
      </div>
    </section>

    <div class="footer-note">Kuxnya NVGR</div>
  </main>

  <script src="/static/js/i18n.js"></script>
  <script src="/static/js/app.js"></script>
  <script>
    "use strict";
    App.init();
    const { api, tg, fmtMoney, fmtQty, fmtShort, fmtMonth, fmtDate, esc, toast, errorText, modal, confirm, initials } = App;
    const t = I18N.t;
    const $ = (id) => document.getElementById(id);

    // Состояние экрана
    let period = { kind: "all", date_from: "", date_to: "" };
    let lastStats = null;
    let clientList = [];           // /api/clients — признак привязки к Telegram
    const charts = {};

    // ---------- Приветствие ----------
    (function greet() {
      const h = new Date().getHours();
      const key = h < 12 ? "greet_morning" : h < 18 ? "greet_day" : "greet_evening";
      const name = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.first_name : "";
      $("hello").textContent = `${t(key)}${name ? ", " + name : ""} 👋`;
    })();

    // ---------- Период ----------
    function periodQuery() {
      const now = new Date();
      const pad = (n) => String(n).padStart(2, "0");
      if (period.kind === "month") return { date_from: `${now.getFullYear()}-${pad(now.getMonth() + 1)}-01` };
      if (period.kind === "year") return { date_from: `${now.getFullYear()}-01-01` };
      if (period.kind === "custom") return { date_from: period.date_from, date_to: period.date_to };
      return {};
    }

    function periodLabel() {
      if (period.kind === "custom") {
        return `${period.date_from ? fmtDate(period.date_from) : "…"} — ${period.date_to ? fmtDate(period.date_to) : "…"}`;
      }
      return t("period_" + period.kind);
    }

    function setPeriod(kind) {
      period.kind = kind;
      document.querySelectorAll("#period-chips .chip").forEach((c) => c.classList.toggle("active", c.dataset.period === kind));
      loadStats();
    }

    document.querySelectorAll("#period-chips .chip").forEach((chip) => chip.addEventListener("click", () => {
      if (chip.dataset.period === "custom") return openSettings();
      setPeriod(chip.dataset.period);
    }));

    // ---------- Загрузка статистики ----------
    async function loadStats() {
      $("stats-error").hidden = true;
      try {
        // App.api проверяет response.ok ДО парсинга JSON: 403/500 → исключение с понятным текстом
        const s = await api("/api/stats", { query: periodQuery() });
        lastStats = s;
        renderKpis(s);
        renderCharts(s.by_month || []);
        renderClients(s.by_client || []);
      } catch (e) {
        lastStats = null;
        $("stats-error").textContent = errorText(e);
        $("stats-error").hidden = false;
        ["k-revenue", "k-profit", "k-margin", "k-debts"].forEach((id) => { $(id).textContent = "—"; });
        // Вкладка клиентов не остаётся на «Загрузка…»
        $("clients").innerHTML = `<div class="error-box">${esc(errorText(e))}</div>`;
        $("clients-count").textContent = "—";
      }
    }

    function renderKpis(s) {
      const debts = (s.by_client || []).reduce((acc, c) => acc + Math.max(0, c.debt), 0);
      const overpaid = (s.by_client || []).reduce((acc, c) => acc + Math.max(0, -c.debt), 0);
      const balance = (s.by_client || []).reduce((acc, c) => acc + c.debt, 0);

      $("k-revenue").textContent = fmtShort(s.revenue);
      $("k-revenue-sub").textContent = fmtMoney(s.revenue);
      $("k-profit").textContent = fmtShort(s.profit);
      $("k-profit").className = "value " + (s.profit < 0 ? "danger" : "");
      $("k-profit-sub").textContent = fmtMoney(s.profit);
      $("k-margin").textContent = `${Number(s.margin).toLocaleString(undefined, { maximumFractionDigits: 1 })} %`;
      $("k-debts").textContent = fmtShort(debts);
      $("k-debts-sub").textContent = overpaid > 0 ? `${t("overpaid")}: ${fmtMoney(overpaid)}` : fmtMoney(debts);
      $("balance").textContent = fmtMoney(balance);

      $("m-portions").textContent = fmtQty(s.portions);
      $("m-cost").textContent = fmtShort(s.cost);
      $("m-purchases").textContent = fmtShort(s.purchases_total);
      $("m-stock").textContent = fmtShort(s.stock_value);
      $("m-writeoffs").textContent = `${fmtShort((s.writeoffs || 0) + (s.staff_meals || 0))} · ${fmtQty((s.writeoff_portions || 0) + (s.staff_portions || 0))} ${t("portions_short")}`;
      $("chart-period").textContent = periodLabel();
    }

    // ---------- Графики ----------
    function renderCharts(months) {
      if (!App.setupCharts()) return; // CDN недоступен — карточки показаны, графики пропускаем
      const labels = months.map((m) => fmtMonth(m.month));
      const money = (v) => fmtMoney(v);
      const axisY = { ticks: { callback: (v) => fmtShort(v) }, grid: { color: "rgba(148,163,184,0.1)" }, border: { display: false } };
      const axisX = { grid: { display: false }, border: { display: false } };
      const tooltip = { callbacks: { label: (c) => ` ${c.dataset.label}: ${money(c.parsed.y)}` } };

      // 1) Выручка по месяцам — столбцы с градиентом
      if (charts.revenue) charts.revenue.destroy();
      charts.revenue = new Chart($("chart-revenue"), {
        type: "bar",
        data: {
          labels,
          datasets: [{
            label: t("revenue"),
            data: months.map((m) => m.revenue),
            backgroundColor: (ctx) => App.chartGradient(ctx, "#8b5cf6", "rgba(99,102,241,0.35)"),
            borderRadius: 10,
            borderSkipped: false,
            maxBarThickness: 56,
          }],
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false }, tooltip },
          scales: { x: axisX, y: axisY },
        },
      });

      // 2) Прибыль против себестоимости — сложенные столбцы + линия маржи
      if (charts.profit) charts.profit.destroy();
      charts.profit = new Chart($("chart-profit"), {
        type: "bar",
        data: {
          labels,
          datasets: [
            { label: t("cost"), data: months.map((m) => m.cost), backgroundColor: "rgba(245,158,11,0.75)", borderRadius: 6, stack: "s", maxBarThickness: 56 },
            { label: t("profit"), data: months.map((m) => m.profit), backgroundColor: "rgba(16,185,129,0.85)", borderRadius: 6, stack: "s", maxBarThickness: 56 },
          ],
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { position: "bottom" }, tooltip },
          scales: { x: { ...axisX, stacked: true }, y: { ...axisY, stacked: true } },
        },
      });
    }

    // ---------- Клиенты (карточки) ----------
    function renderClients(rows) {
      $("clients-count").textContent = rows.length;
      if (!rows.length) { $("clients").innerHTML = App.emptyHtml("🤝", "nothing_found"); return; }
      $("clients").innerHTML = rows.map((c) => {
        const info = clientList.find((x) => x.name === c.client);
        const linked = info ? info.linked : false;
        const balanceCls = c.debt > 0 ? "debt" : c.debt < 0 ? "over" : "";
        const balanceLabel = c.debt > 0 ? t("debt") : c.debt < 0 ? t("overpaid") : t("balance_zero");
        return `
          <article class="client-card">
            <div class="head tappable" data-open-client="${esc(c.client)}">
              <div class="avatar">${esc(initials(c.client))}</div>
              <div class="grow" style="min-width:0">
                <div class="name">${esc(c.client)}</div>
                <div class="small muted">${fmtQty(c.portions)} ${esc(t("portions_short"))} ·
                  <span class="badge ${linked ? "ok" : ""}">${esc(t(linked ? "linked" : "not_linked"))}</span></div>
              </div>
              <span class="chevron">›</span>
            </div>
            <div class="figures">
              <div class="figure"><div class="label">${esc(t("charged"))}</div><div class="value">${fmtShort(c.charged_total)}</div></div>
              <div class="figure"><div class="label">${esc(t("paid"))}</div><div class="value">${fmtShort(c.paid_total)}</div></div>
              <div class="figure ${balanceCls}"><div class="label">${esc(balanceLabel)}</div><div class="value">${fmtShort(Math.abs(c.debt))}</div></div>
            </div>
            <div class="actions">
              <button type="button" class="btn secondary" data-op="payment" data-client="${esc(c.client)}">💵 ${esc(t("record_payment"))}</button>
              <button type="button" class="btn secondary" data-op="delivery" data-client="${esc(c.client)}">📦 ${esc(t("record_delivery"))}</button>
            </div>
          </article>`;
      }).join("");
    }

    $("clients").addEventListener("click", (ev) => {
      const b = ev.target.closest("[data-op]");
      if (b) return openOperation(b.dataset.client, b.dataset.op);
      const head = ev.target.closest("[data-open-client]");
      if (head) openClient(head.dataset.openClient);   // нажатие на клиента — его поставки и оплаты
    });

    async function loadClientList() {
      try { clientList = await api("/api/clients"); } catch (e) { clientList = []; }
    }

    // ---------- Модальное окно: оплата / поставка ----------
    function openOperation(clientName, op = "payment") {
      const names = (lastStats ? lastStats.by_client.map((c) => c.client) : clientList.map((c) => c.name));
      const body = document.createElement("div");
      body.className = "form";
      body.innerHTML = `
        <div class="tabs" style="position:static">
          <button type="button" data-op="payment">💵 ${esc(t("record_payment"))}</button>
          <button type="button" data-op="delivery">📦 ${esc(t("record_delivery"))}</button>
        </div>
        <div class="field"><label>${esc(t("client"))}</label>
          <select name="client">${names.map((n) => `<option value="${esc(n)}">${esc(n)}</option>`).join("")}</select></div>
        <div data-only="delivery" class="form">
          <div class="field"><label>${esc(t("dish"))}</label><input name="dish" maxlength="255" autocomplete="off"></div>
          <div class="row">
            <div class="field"><label>${esc(t("portions_count"))}</label><input name="portions" type="number" inputmode="numeric" min="1" step="1"></div>
            <div class="field"><label>${esc(t("cost_label"))}</label><input name="cost" type="number" inputmode="decimal" min="0" step="any"></div>
          </div>
        </div>
        <div class="row">
          <div class="field"><label>${esc(t("amount"))}</label><input name="amount" type="number" inputmode="decimal" min="0" step="any"></div>
          <div class="field"><label>${esc(t("date"))}</label><input name="date" type="date" value="${App.today()}"></div>
        </div>
        <div data-only="payment" class="field"><label>${esc(t("payment_type"))}</label>
          <select name="ptype">
            <option value="cash">${esc(t("cash"))}</option><option value="card">${esc(t("card"))}</option><option value="transfer">${esc(t("transfer"))}</option>
          </select></div>`;
      const f = (n) => body.querySelector(`[name="${n}"]`);
      if (clientName) f("client").value = clientName;

      function switchOp(next) {
        op = next;
        body.querySelectorAll(".tabs [data-op]").forEach((x) => x.classList.toggle("active", x.dataset.op === op));
        body.querySelectorAll("[data-only]").forEach((x) => { x.hidden = x.dataset.only !== op; });
      }
      body.querySelectorAll(".tabs [data-op]").forEach((x) => x.addEventListener("click", () => switchOp(x.dataset.op)));
      switchOp(op);

      modal({
        title: t("operation_title"),
        body,
        actions: [
          { label: t("cancel"), kind: "secondary" },
          { label: t("save"), onClick: async () => {
            const client = f("client").value;
            const amount = parseFloat(f("amount").value);
            const date = f("date").value || App.today();
            body.querySelectorAll(".invalid").forEach((x) => x.classList.remove("invalid"));
            let path, payload, question;
            if (op === "payment") {
              if (!(amount > 0)) { f("amount").classList.add("invalid"); toast(t("price_required"), "error"); return false; }
              path = "/api/client/payment";
              payload = { client, amount, date, payment_type: f("ptype").value };
              question = t("confirm_payment", { amount: fmtMoney(amount), client: esc(client) });
            } else {
              const dish = f("dish").value.trim();
              const portions = parseInt(f("portions").value, 10);
              if (!dish) { f("dish").classList.add("invalid"); toast(t("err_validation_error"), "error"); return false; }
              if (!(portions > 0)) { f("portions").classList.add("invalid"); toast(t("quantity_required"), "error"); return false; }
              if (!(amount >= 0) || f("amount").value === "") { f("amount").classList.add("invalid"); toast(t("price_required"), "error"); return false; }
              path = "/api/client/delivery";
              payload = { client, amount, date, dish_name: dish, portions, cost: parseFloat(f("cost").value) || 0 };
              question = t("confirm_delivery", { dish: esc(dish), portions, amount: fmtMoney(amount), client: esc(client) });
            }
            if (!(await confirm(question, { icon: op === "payment" ? "💵" : "📦" }))) return false;
            await api(path, { json: payload });     // успех — только после ответа сервера
            toast(t("saved"));
            loadStats();
          } },
        ],
      });
    }

    $("qa-operation").addEventListener("click", () => openOperation(null, "payment"));

    // ---------- Экспорт: бот присылает CSV в чат ----------
    $("qa-export").addEventListener("click", async () => {
      if (!(await confirm(esc(t("export_confirm", { period: periodLabel() })), { icon: "📊", okLabel: t("send") }))) return;
      const btn = $("qa-export");
      btn.disabled = true;
      try {
        await api("/api/stats/export-send", { json: { date_from: periodQuery().date_from || null, date_to: periodQuery().date_to || null } });
        toast(t("export_sent"));
      } catch (e) { App.showError(e); } finally { btn.disabled = false; }
    });

    // ---------- Настройки: свой период и поддержка ----------
    function openSettings() {
      const body = `
        <div class="field"><label>${esc(t("period_custom"))}</label>
          <div class="row">
            <input type="date" name="from" value="${esc(period.date_from)}" aria-label="${esc(t("date_from"))}">
            <input type="date" name="to" value="${esc(period.date_to)}" aria-label="${esc(t("date_to"))}">
          </div></div>
        <div class="card" style="box-shadow:none;background:rgba(51,65,85,.35)">
          <div class="small muted">${esc(t("language_hint"))}</div>
        </div>`;
      modal({
        title: t("settings_title"),
        body,
        actions: [
          { label: t("cancel"), kind: "secondary" },
          { label: t("apply"), onClick: (m) => {
            const from = m.body.querySelector('[name="from"]').value;
            const to = m.body.querySelector('[name="to"]').value;
            if (from && to && from > to) { toast(t("err_period"), "error"); return false; }
            period.date_from = from; period.date_to = to;
            setPeriod(from || to ? "custom" : "all");
          } },
        ],
      });
    }
    $("qa-settings").addEventListener("click", openSettings);

    // ================= 👥 Команда: владелец назначает роли =================
    // Человек открыл бота → владельцу пришло «Новый человек» → здесь выбираем ему роль →
    // бот пишет человеку, и «ОТКРЫТЬ» ведёт его сразу в свой кабинет.
    const ASSIGNABLE = ["cook", "purchaser", "client"];

    function teamRow(p, clients) {
      const row = document.createElement("div");
      row.className = "team-row";
      const roleBadge = p.is_owner
        ? `<span class="badge info">👑 ${esc(t("team_owner"))}</span>`
        : p.role ? `<span class="badge ok">${esc(t("role_" + p.role + "_name"))}${p.client ? " · " + esc(p.client) : ""}</span>`
        : `<span class="badge warning">⏳ ${esc(t("team_waiting"))}</span>`;
      row.innerHTML = `
        <div class="team-head">
          <div class="avatar">${esc(initials(p.name))}</div>
          <div class="grow"><div class="title">${esc(p.name)}</div>
            <div class="hint">ID ${p.telegram_id}${p.since ? " · " + esc(t("team_since", { date: fmtDate(p.since) })) : ""}</div></div>
          ${roleBadge}
        </div>`;
      if (p.is_owner) return row;
      const form = document.createElement("div");
      form.className = "team-form";
      form.innerHTML = `
        <select name="role">
          <option value="">${esc(t("team_no_role"))}</option>
          ${ASSIGNABLE.map((r) => `<option value="${r}" ${p.role === r ? "selected" : ""}>${esc(t("role_" + r + "_name"))}</option>`).join("")}
        </select>
        <select name="client" ${p.role === "client" ? "" : "hidden"}>
          <option value="">${esc(t("team_client_company"))}…</option>
          ${clients.map((c) => `<option value="${esc(c.name)}" ${p.client === c.name ? "selected" : ""}>${esc(c.name)}</option>`).join("")}
        </select>
        <button type="button" class="btn">${esc(t("save"))}</button>`;
      const roleSel = form.querySelector('[name="role"]');
      const clientSel = form.querySelector('[name="client"]');
      roleSel.addEventListener("change", () => { clientSel.hidden = roleSel.value !== "client"; });
      const btn = form.querySelector("button");
      btn.addEventListener("click", async () => {
        const role = roleSel.value || null;
        if (role === "client" && !clientSel.value) return toast(t("err_client_required"), "error");
        btn.disabled = true;
        try {
          const saved = await api(`/api/team/${p.telegram_id}`, { method: "PUT", json: { role, client: role === "client" ? clientSel.value : null } });
          toast(t("team_saved"));
          row.replaceWith(teamRow(saved, clients));
        } catch (e) {
          toast(errorText(e), "error");
          btn.disabled = false;
        }
      });
      row.appendChild(form);
      return row;
    }

    async function openTeam() {
      const body = document.createElement("div");
      body.innerHTML = `<p class="hint" style="margin-top:0">${esc(t("team_hint"))}</p>` + App.skeletonHtml(3);
      modal({ title: "👥 " + t("team_title"), body });
      try {
        const data = await api("/api/team");
        body.innerHTML = `<p class="hint" style="margin-top:0">${esc(t("team_hint"))}</p>`;
        if (!data.people.some((p) => !p.is_owner)) {
          body.insertAdjacentHTML("beforeend", `<div class="empty">${esc(t("team_empty"))}</div>`);
        }
        data.people.forEach((p) => body.appendChild(teamRow(p, data.clients)));
      } catch (e) {
        body.innerHTML = `<div class="error-box">${esc(errorText(e))}</div>`;
      }
    }
    $("qa-team").addEventListener("click", openTeam);


    // ================= Клиент: его поставки и оплаты (по нажатию на карточку) =================
    async function openClient(name) {
      const body = document.createElement("div");
      body.className = "form";
      body.innerHTML = App.skeletonHtml(5);
      modal({ title: name, body, actions: [
        { label: t("cancel"), kind: "secondary" },
        { label: "📄 " + t("act_send_owner"), onClick: async () => {
          await api("/api/client/act-send", { json: { client: name } });   // бот пришлёт акт владельцу
          toast(t("sent_to_chat"));
        } },
      ] });
      try {
        const [inv, del] = await Promise.all([
          api("/api/client/invoice", { query: { client: name } }),
          api("/api/client/deliveries", { query: { client: name } }),
        ]);
        const items = [...del.items].sort((a, b) => (a.date < b.date ? 1 : -1));   // новые сверху
        let month = "";
        const list = items.map((d) => {
          const m = d.date.slice(0, 7);
          const head = m !== month ? `<div class="list-group-title">${esc(App.fmtMonth(m))}</div>` : "";
          month = m;
          return `${head}<div class="list-item"><div class="grow"><div class="title">${esc(d.dish_name)}</div>
            <div class="hint">${fmtDate(d.date)} · ${fmtQty(d.portions)} ${esc(t("portions_short"))}</div></div>
            <div class="amount">${fmtMoney(d.amount)}</div></div>`;
        }).join("") || App.emptyHtml("📦", "no_deliveries");
        const pays = inv.payments.map((p) => `<div class="list-item"><div class="grow"><div class="title">💵 ${esc(t(p.payment_type))}</div>
            <div class="hint">${fmtDate(p.date)}</div></div><div class="amount ok">+${fmtMoney(p.amount)}</div></div>`).join("")
          || App.emptyHtml("💵", "no_payments");
        const debtLabel = inv.debt > 0 ? t("debt") : inv.debt < 0 ? t("overpaid") : t("balance_zero");
        body.innerHTML = `
          <div class="mini-stats" style="grid-template-columns:repeat(3,minmax(0,1fr))">
            <div class="mini-stat"><div class="label">${esc(t("charged"))}</div><div class="value">${fmtShort(inv.charged)}</div></div>
            <div class="mini-stat"><div class="label">${esc(t("paid"))}</div><div class="value">${fmtShort(inv.paid)}</div></div>
            <div class="mini-stat"><div class="label">${esc(debtLabel)}</div><div class="value ${inv.debt > 0 ? "danger" : "ok"}">${fmtShort(Math.abs(inv.debt))}</div></div>
          </div>
          <div class="small muted">${esc(t("explain_client_debt", { charged: fmtMoney(inv.charged), paid: fmtMoney(inv.paid), debt: fmtMoney(inv.debt) }))}</div>
          <div class="price-row"><label>💰 ${esc(t("client_price"))}</label>
            <input type="number" inputmode="numeric" min="0" step="any" data-role="price" placeholder="—">
            <button type="button" class="btn secondary auto" data-role="price-save">${esc(t("save"))}</button></div>
          <div class="small muted" style="margin-top:-6px">${esc(t("client_price_hint"))}</div>
          <div class="tabs" style="position:static">
            <button type="button" class="active" data-ct="d">📦 ${esc(t("tab_deliveries"))} · ${items.length}</button>
            <button type="button" data-ct="p">💵 ${esc(t("tab_payments"))} · ${inv.payments.length}</button>
          </div>
          <div class="list" data-cp="d">${list}</div>
          <div class="list" data-cp="p" hidden>${pays}</div>`;
        // Цена порции клиента: по ней считается выручка при раздаче поваром из партии
        api("/api/clients/prices").then((list) => {
          const p = list.find((x) => x.client === name);
          if (p) body.querySelector('[data-role="price"]').value = p.price || "";
        }).catch(() => {});
        body.querySelector('[data-role="price-save"]').addEventListener("click", async (ev) => {
          const price = parseFloat(body.querySelector('[data-role="price"]').value);
          if (!(price > 0)) return toast(t("price_required"), "error");
          const btn = ev.currentTarget;   // после await currentTarget уже null — сохраняем заранее
          btn.disabled = true;
          try { await api("/api/clients/price", { method: "PUT", json: { client: name, price } }); toast(t("saved")); }
          catch (e) { App.showError(e); } finally { btn.disabled = false; }
        });
        body.querySelectorAll("[data-ct]").forEach((b) => b.addEventListener("click", () => {
          body.querySelectorAll("[data-ct]").forEach((x) => x.classList.toggle("active", x === b));
          body.querySelectorAll("[data-cp]").forEach((p) => { p.hidden = p.dataset.cp !== b.dataset.ct; });
        }));
      } catch (e) {
        body.innerHTML = `<div class="error-box">${esc(errorText(e))}</div>`;
      }
    }

    // ================= «Откуда эти цифры»: окошко с расчётом по нажатию =================
    /** Таблица «название — значение» + строка итога */
    function explainTable(rows, total) {
      return `<div class="explain-table">${rows.map(([k, v, cls]) =>
        `<div class="er"><span>${esc(k)}</span><b class="${cls || ""}">${v}</b></div>`).join("")}
        ${total ? `<div class="er total"><span>${esc(total[0])}</span><b>${total[1]}</b></div>` : ""}</div>`;
    }
    const formula = (text) => `<div class="formula">${text}</div>`;

    async function explain(kind) {
      const s = lastStats;
      if (!s) return;
      const cl = s.by_client || [];
      const period = `<div class="small muted">${esc(t("explain_period"))}: <b>${esc(periodLabel())}</b></div>`;
      let title = "", html = "";
      if (kind === "revenue") {
        title = "💰 " + t("revenue");
        html = period + `<p>${esc(t("explain_revenue", { n: s.deliveries_count, p: fmtQty(s.portions) }))}</p>`
          + explainTable(cl.map((c) => [c.client, fmtMoney(c.revenue)]), [t("total"), fmtMoney(s.revenue)]);
      } else if (kind === "cost") {
        title = "🧾 " + t("cost");
        html = period + `<p>${esc(t("explain_cost"))}</p>`
          + explainTable(cl.map((c) => [c.client, fmtMoney(c.cost)]), [t("total"), fmtMoney(s.cost)]);
      } else if (kind === "profit") {
        title = "📈 " + t("profit");
        html = period + formula(`${esc(t("revenue"))} ${fmtMoney(s.revenue)}<br>− ${esc(t("cost"))} ${fmtMoney(s.cost)}<br>= <b>${fmtMoney(s.profit)}</b>`)
          + `<p class="small muted">${esc(t("explain_profit_note"))}</p>`
          + explainTable(cl.map((c) => [c.client, fmtMoney(c.revenue - c.cost)]));
      } else if (kind === "margin") {
        title = "🎯 " + t("margin");
        html = period + formula(`${esc(t("profit"))} ${fmtMoney(s.profit)} ÷ ${esc(t("revenue"))} ${fmtMoney(s.revenue)} × 100 = <b>${s.margin} %</b>`)
          + `<p class="small muted">${esc(t("explain_margin"))}</p>`;
      } else if (kind === "debts" || kind === "balance") {
        title = kind === "debts" ? "🧾 " + t("kpi_debts") : "⚖️ " + t("balance_label");
        const total = cl.reduce((a, c) => a + (kind === "debts" ? Math.max(0, c.debt) : c.debt), 0);
        html = `<p>${esc(t(kind === "debts" ? "explain_debts" : "explain_balance"))}</p>`
          + explainTable(cl.map((c) => [c.client, `${fmtMoney(c.charged_total)} − ${fmtMoney(c.paid_total)} = ${fmtMoney(c.debt)}`, c.debt > 0 ? "danger" : "ok"]),
            [t("total"), fmtMoney(total)]);
      } else if (kind === "portions") {
        title = "🍽 " + t("portions");
        html = period + `<p>${esc(t("explain_portions", { n: s.deliveries_count }))}</p>`
          + explainTable(cl.map((c) => [c.client, fmtQty(c.portions)]), [t("total"), fmtQty(s.portions)]);
      } else if (kind === "purchases") {
        title = "🛒 " + t("purchases_total");
        html = period + `<p>${esc(t("explain_purchases", { n: s.purchases_count }))}</p>`
          + explainTable([], [t("total"), fmtMoney(s.purchases_total)]);
      } else if (kind === "writeoffs") {
        title = "🗑 " + t("writeoffs_staff");
        html = period + `<p>${esc(t("explain_writeoffs"))}</p>`
          + explainTable([[t("writeoffs_waste") + ` · ${fmtQty(s.writeoff_portions || 0)} ${t("portions_short")}`, fmtMoney(s.writeoffs || 0), "danger"],
                          [t("writeoffs_staff_meals") + ` · ${fmtQty(s.staff_portions || 0)} ${t("portions_short")}`, fmtMoney(s.staff_meals || 0)]],
            [t("total"), fmtMoney((s.writeoffs || 0) + (s.staff_meals || 0))])
          + formula(`${esc(t("profit"))} ${fmtMoney(s.profit)} − ${fmtMoney((s.writeoffs || 0) + (s.staff_meals || 0))} = <b>${fmtMoney(s.profit_after_writeoffs ?? s.profit)}</b>`)
          + `<p class="small muted">${esc(t("explain_writeoffs_note"))}</p>`;
      } else if (kind === "stock") {
        title = "📦 " + t("stock_value");
        let rows = [];
        try {
          const stock = await api("/api/stock");
          rows = stock.filter((p) => p.quantity > 0).sort((a, b) => b.value - a.value).slice(0, 12)
            .map((p) => [`${p.name} · ${fmtQty(p.quantity)} ${p.unit} × ${fmtMoney(p.price_per_unit)}`, fmtMoney(p.value)]);
        } catch (e) { /* покажем только итог */ }
        html = `<p>${esc(t("explain_stock", { n: s.stock_items }))}</p>`
          + (rows.length ? explainTable(rows, [t("total"), fmtMoney(s.stock_value)]) : `<p class="muted">${esc(t("explain_stock_empty"))}</p>`);
      }
      modal({ title, body: `<div class="form">${html}</div>`, actions: [{ label: t("understood"), kind: "secondary" }] });
    }

    document.querySelectorAll("[data-explain]").forEach((el) => el.addEventListener("click", () => explain(el.dataset.explain)));

    // ================= План / факт / прогноз =================
    let planMonth = App.today().slice(0, 7);
    let lastPlan = null;

    function shiftMonth(ym, delta) {
      const [y, m] = ym.split("-").map(Number);
      const d = new Date(y, m - 1 + delta, 1);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
    }

    /** Полоса: сплошная часть — факт, штриховка — прогноз, отметка — 100% плана */
    function bar(factPct, forecastPct) {
      const f = Math.min(factPct || 0, 130), fc = Math.min(forecastPct || 0, 130);
      const scale = (v) => (v / 130) * 100;
      const cls = (forecastPct || 0) >= 100 ? "good" : (forecastPct || 0) >= 85 ? "warn" : "bad";
      return `<div class="pbar ${cls}"><span class="pfc" style="width:${scale(fc)}%"></span><span class="pfact" style="width:${scale(f)}%"></span><span class="pmark" style="left:${scale(100)}%"></span></div>`;
    }

    function sourceBadge(src) {
      return src === "manual" ? `<span class="badge info">✏️ ${esc(t("plan_manual"))}</span>`
        : src === "auto" ? `<span class="badge">🤖 ${esc(t("plan_auto"))}</span>` : `<span class="badge warning">${esc(t("plan_none"))}</span>`;
    }

    function renderPlan(p) {
      lastPlan = p;
      $("plan-month").textContent = App.fmtMonth(p.month);
      const pctTxt = (v) => (v == null ? "—" : `${Math.round(v)}%`);
      const fcCls = (p.forecast_pct || 0) >= 100 ? "ok" : (p.forecast_pct || 0) >= 85 ? "text-warning" : "danger";
      $("plan-body").innerHTML = `
        <div class="plan-grid">
          <div class="plan-cell tappable" data-plan-explain="plan">
            <div class="label">${esc(t("plan_plan"))} ${sourceBadge(p.plan.source)}</div>
            <div class="value">${fmtQty(p.plan.portions)} <small>${esc(t("portions_short"))}</small></div>
            <div class="sub">${fmtMoney(p.plan.revenue)}</div>
          </div>
          <div class="plan-cell tappable" data-plan-explain="fact">
            <div class="label">${esc(t("plan_fact"))} · ${pctTxt(p.fact_pct)}</div>
            <div class="value">${fmtQty(p.fact.portions)} <small>${esc(t("portions_short"))}</small></div>
            <div class="sub">${fmtMoney(p.fact.revenue)}</div>
          </div>
          <div class="plan-cell tappable" data-plan-explain="forecast">
            <div class="label">${esc(t("plan_forecast"))} · <span class="${fcCls}">${pctTxt(p.forecast_pct)}</span></div>
            <div class="value">${fmtQty(p.forecast.portions)} <small>${esc(t("portions_short"))}</small></div>
            <div class="sub">${fmtMoney(p.forecast.revenue)}</div>
          </div>
        </div>
        ${bar(p.fact_pct, p.forecast_pct)}
        <div class="small muted" style="margin-top:6px">${esc(t("plan_days", { passed: p.days.passed, total: p.days.total, left: p.days.left }))}</div>
        <div class="list" style="margin-top:8px">${p.clients.map((c) => `
          <div class="list-item tappable" data-open-client="${esc(c.client)}" style="flex-direction:column;align-items:stretch;gap:6px">
            <div style="display:flex;justify-content:space-between;gap:8px">
              <span class="title">${esc(c.client)}</span>
              <span class="small">${fmtQty(c.fact.portions)} / ${fmtQty(c.plan.portions)} · <b>${esc(t("plan_forecast_short"))} ${fmtQty(c.forecast.portions)}</b></span>
            </div>
            ${bar(c.fact_pct, c.forecast_pct)}
          </div>`).join("")}</div>`;
      $("plan-body").querySelectorAll("[data-plan-explain]").forEach((el) => el.addEventListener("click", () => explainPlan(el.dataset.planExplain)));
      $("plan-body").querySelectorAll("[data-open-client]").forEach((el) => el.addEventListener("click", () => openClient(el.dataset.openClient)));
    }

    async function loadPlan() {
      $("plan-month").textContent = App.fmtMonth(planMonth);
      try { renderPlan(await api("/api/plan", { query: { month: planMonth } })); }
      catch (e) { $("plan-body").innerHTML = `<div class="error-box">${esc(errorText(e))}</div>`; }
    }

    function explainPlan(kind = "plan") {
      const p = lastPlan;
      if (!p) return;
      const x = p.explain;
      const hist = x.history_from ? `${fmtDate(x.history_from)} — ${fmtDate(x.history_to)}` : "—";
      const blocks = {
        plan: p.plan.source === "manual"
          ? `<p>${esc(t("explain_plan_manual"))}</p>`
          : formula(`${esc(t("explain_plan_auto", { from: hist }))}<br>${fmtQty(x.history_portions)} ${esc(t("portions_short"))} ÷ ${x.history_days} ${esc(t("work_days"))} = <b>${x.history_daily_portions}</b> ${esc(t("per_day"))}<br>× ${p.days.total} ${esc(t("work_days"))} = <b>${fmtQty(p.plan.portions)} ${esc(t("portions_short"))}</b>`),
        fact: `<p>${esc(t("explain_fact", { n: p.fact.deliveries }))}</p>`
          + explainTable(p.clients.map((c) => [c.client, `${fmtQty(c.fact.portions)} · ${fmtMoney(c.fact.revenue)}`]), [t("total"), `${fmtQty(p.fact.portions)} · ${fmtMoney(p.fact.revenue)}`]),
        forecast: formula(p.forecast.pace === "final" ? esc(t("explain_forecast_final"))
          : `${esc(t("plan_fact"))} ${fmtQty(p.fact.portions)}<br>+ ${p.forecast.pace === "month" ? x.month_daily_portions : x.history_daily_portions} ${esc(t("per_day"))} × ${p.days.left} ${esc(t("work_days_left"))}<br>= <b>${fmtQty(p.forecast.portions)} ${esc(t("portions_short"))}</b>`)
          + `<p class="small muted">${esc(t(p.forecast.pace === "month" ? "explain_pace_month" : "explain_pace_history"))}</p>`,
      };
      const titles = { plan: t("plan_plan"), fact: t("plan_fact"), forecast: t("plan_forecast") };
      modal({ title: "🎯 " + titles[kind], body: `<div class="form">${blocks[kind]}<p class="small muted">${esc(t("explain_workdays"))}</p></div>`,
        actions: [{ label: t("understood"), kind: "secondary" }] });
    }

    function openPlanEditor() {
      const p = lastPlan;
      if (!p) return;
      // Цена порции по умолчанию — средняя из истории (или из факта месяца)
      const avgPrice = Math.round((p.explain.history_revenue / (p.explain.history_portions || 1)) || (p.fact.revenue / (p.fact.portions || 1)) || 30000);
      const rows = [["", t("plan_total_kitchen"), p.plan]].concat(p.clients.map((c) => [c.client, c.client, c.plan]));
      const body = document.createElement("div");
      body.className = "form";
      body.innerHTML = `
        <p class="small muted">${esc(t("plan_edit_hint", { month: App.fmtMonth(p.month) }))}</p>
        <div class="field"><label>${esc(t("plan_price"))}</label><input name="price" type="number" inputmode="numeric" min="0" step="any" value="${avgPrice}"></div>
        ${rows.map(([key, label, pl], i) => `
          <div class="field"><label>${esc(label)} · ${esc(t("portions_short"))} ${sourceBadge(pl.source)}</label>
            <input data-plan-key="${esc(key)}" data-i="${i}" type="number" inputmode="numeric" min="0" step="1" value="${pl.portions}"></div>`).join("")}`;
      modal({
        title: "✏️ " + t("plan_set"),
        body,
        actions: [
          { label: t("plan_reset"), kind: "secondary", onClick: async () => {
            for (const [key, , pl] of rows) if (pl.source === "manual") {
              await api(`/api/plan?month=${p.month}` + (key ? `&client=${encodeURIComponent(key)}` : ""), { method: "DELETE" });
            }
            toast(t("saved")); loadPlan();
          } },
          { label: t("save"), onClick: async () => {
            const price = parseFloat(body.querySelector('[name="price"]').value) || 0;
            let last = null;
            for (const input of body.querySelectorAll("[data-plan-key]")) {
              const [key, , pl] = rows[Number(input.dataset.i)];
              const portions = parseInt(input.value, 10);
              if (!(portions >= 0) || (portions === pl.portions && pl.source !== "none")) continue;   // не меняли — не трогаем
              last = await api("/api/plan", { method: "PUT", json: { month: p.month, client: key || null, portions, revenue: portions * price } });
            }
            toast(t("saved"));
            if (last) renderPlan(last); else loadPlan();
          } },
        ],
      });
    }

    $("plan-prev").addEventListener("click", () => { planMonth = shiftMonth(planMonth, -1); loadPlan(); });
    $("plan-next").addEventListener("click", () => { planMonth = shiftMonth(planMonth, 1); loadPlan(); });
    $("plan-edit").addEventListener("click", openPlanEditor);
    $("plan-how").addEventListener("click", () => explainPlan("forecast"));

    // Кнопка «🤝 Клиенты» в боте открывает ?tab=clients — прокручиваем к клиентам; ?tab=team — «Команда»
    const startTab = new URLSearchParams(location.search).get("tab");

    (async function start() {
      await Promise.all([loadClientList(), loadStats(), loadPlan()]);
      if (startTab === "clients") $("clients-section").scrollIntoView({ behavior: "smooth", block: "start" });
      if (startTab === "team") openTeam();   // из уведомления «Новый человек» в боте
    })();
  </script>
</body>
</html>
