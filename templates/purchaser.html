<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Kuxnya NVGR — Purchaser</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <!--
    Экран закупщика. Исправленные баги из технического обзора:
    1. Прогресс — через tg.MainButton.showProgress() (а не tg.showProgress()); кнопка блокируется
       на время запроса и ВСЕГДА разблокируется в finally. Повторное нажатие игнорируется (флаг saving).
    2. Товар проверяется на сервере: нет в справочнике → 400 product_not_found → сообщение
       «Товар не найден в справочнике». Нераспознанная ИИ позиция не подставляется на другой товар:
       пока товар не выбран вручную, её нельзя отметить к сохранению.
    3. «Сохранено» показывается ТОЛЬКО после успешного ответа сервера (await, проверка response.ok).
    4. Все запросы — по относительным путям /api/... (static/js/app.js).
  -->
  <main class="app">
    <header class="topbar">
      <div>
        <div class="hello">🛒 <span data-i18n="purchaser_title"></span></div>
        <div class="subtitle" data-i18n="purchaser_subtitle"></div>
      </div>
      <div class="balance">
        <div class="label" data-i18n="today_spent"></div>
        <div class="value num" id="today-spent">—</div>
      </div>
    </header>

    <div class="tabs">
      <button type="button" data-tab="manual" data-i18n="tab_manual"></button>
      <button type="button" data-tab="photo" data-i18n="tab_photo"></button>
      <button type="button" data-tab="ai" data-i18n="tab_ai"></button>
    </div>

    <!-- ===== ИИ-помощник: свободный чат ===== -->
    <section data-panel="ai" hidden class="card chat-card">
      <div class="chat-log" id="chat-log" aria-live="polite"></div>
      <div class="chips" id="chat-suggestions"></div>
      <form class="chat-input" id="chat-form" autocomplete="off">
        <textarea id="chat-text" rows="1" maxlength="2000" data-i18n-placeholder="chat_placeholder"></textarea>
        <button type="submit" class="send-btn" id="chat-send" aria-label="Send">➤</button>
      </form>
    </section>

    <!-- ===== Ручной ввод ===== -->
    <section data-panel="manual" hidden>
      <form class="card form" id="manual-form" novalidate>
        <div class="field">
          <label for="product" data-i18n="product"></label>
          <select id="product"></select>
          <div class="small muted" id="product-hint"></div>
        </div>
        <div class="row">
          <div class="field">
            <label for="quantity" data-i18n="quantity"></label>
            <input id="quantity" type="number" inputmode="decimal" min="0" step="any" placeholder="0">
          </div>
          <div class="field">
            <label for="unit" data-i18n="unit"></label>
            <select id="unit">
              <option value="kg">kg</option><option value="g">g</option><option value="l">l</option>
              <option value="ml">ml</option><option value="pcs">pcs</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="price" data-i18n="price_per_unit"></label>
          <input id="price" type="number" inputmode="decimal" min="0" step="any" placeholder="0">
        </div>
        <div class="row">
          <div class="field">
            <label for="payment" data-i18n="payment_method"></label>
            <select id="payment">
              <option value="cash" data-i18n="cash"></option>
              <option value="card" data-i18n="card"></option>
              <option value="transfer" data-i18n="transfer"></option>
            </select>
          </div>
          <div class="field">
            <label for="date" data-i18n="date"></label>
            <input id="date" type="date">
          </div>
        </div>
        <!-- Итоговая сумма считается автоматически: количество × цена -->
        <div class="total-big"><span class="label" data-i18n="purchase_total"></span><span class="value" id="manual-total">0</span></div>
        <!-- Вне Telegram — своя кнопка; в Telegram используется MainButton (одна кнопка, без дубля) -->
        <button class="btn lg" id="save-manual" type="submit" hidden>💾 <span data-i18n="save_purchase"></span></button>
      </form>
    </section>

    <!-- ===== Фото чека ===== -->
    <section data-panel="photo" hidden class="section">
      <button type="button" class="upload" id="upload">
        <span class="u-icon">📸</span>
        <span class="u-title" data-i18n="ai_scan"></span>
        <span class="u-hint" data-i18n="upload_hint"></span>
      </button>
      <input id="ai-file" type="file" accept="image/*" hidden>

      <div class="card" id="ai-card" hidden>
        <div class="card-head"><h2 data-i18n="ai_items"></h2><span class="hint" data-i18n="choose_items"></span></div>
        <div id="ai-items"></div>
        <div class="total-big" style="margin-top:12px"><span class="label" data-i18n="selected_total"></span><span class="value" id="ai-total">0</span></div>
        <button class="btn lg" id="save-receipt" type="button" hidden style="margin-top:12px">💾 <span id="save-receipt-label"></span></button>
      </div>
    </section>

    <!-- ===== Что купить на неделю (по меню повара) ===== -->
    <section class="card" id="shop-card" hidden>
      <div class="card-head"><h2>📝 <span data-i18n="shopping_list"></span></h2><span class="badge warning" id="shop-total">—</span></div>
      <p class="small muted" style="margin:0 0 8px" data-i18n="shopping_tap_hint"></p>
      <div id="shop" class="list"></div>
    </section>

    <!-- ===== Последние закупки ===== -->
    <section class="card">
      <div class="card-head"><h2 data-i18n="recent_purchases"></h2></div>
      <div id="recent" class="list"></div>
    </section>
  </main>

  <script src="/static/js/i18n.js"></script>
  <script src="/static/js/app.js"></script>
  <script>
    "use strict";
    App.init();
    const { api, tg, fmtMoney, fmtQty, fmtDate, esc, toast, showError, errorText, confirm } = App;
    const t = I18N.t;
    const $ = (id) => document.getElementById(id);
    const UNITS = ["kg", "g", "l", "ml", "pcs"];
    const insideTelegram = Boolean(tg && tg.initData);
    const mb = insideTelegram ? tg.MainButton : null;

    let stock = [];
    let aiItems = [];
    let saving = false;           // защита от двойного нажатия (и MainButton, и своей кнопки)
    let activeTab = "manual";

    const num = (v) => { const n = parseFloat(String(v).replace(",", ".")); return Number.isFinite(n) ? n : NaN; };
    const round2 = (n) => Math.round(n * 100) / 100;

    // ---------- Справочник товаров и последние закупки ----------
    async function loadStock() {
      try {
        stock = await api("/api/stock");
        const prev = $("product").value;
        $("product").innerHTML = `<option value="">${esc(t("choose_product"))}</option>` +
          `<option value="__new">＋ ${esc(t("new_product"))}…</option>` +
          stock.map((p) => `<option value="${p.id}">${esc(p.name)}</option>`).join("");
        if (prev) $("product").value = prev;
        updateProductHint();
        if (aiItems.length) renderAiItems();
      } catch (e) { showError(e); }
    }

    async function loadRecent() {
      $("recent").innerHTML = App.skeletonHtml(3);
      try {
        const rows = await api("/api/purchase");
        const today = App.today();
        const spent = rows.filter((p) => p.date === today).reduce((a, p) => a + p.total_price, 0);
        $("today-spent").textContent = fmtMoney(spent);
        $("recent").innerHTML = rows.map((p) => `
          <div class="list-item">
            <div class="lead">🧺</div>
            <div class="grow"><div class="title">${esc(p.product_name)}</div>
              <div class="hint">${fmtDate(p.date)} · ${fmtQty(p.quantity)} ${esc(p.unit)} · ${esc(t(p.payment_method))}</div></div>
            <div class="amount">${fmtMoney(p.total_price)}</div>
          </div>`).join("") || App.emptyHtml("🧺", "nothing_found");
      } catch (e) {
        $("recent").innerHTML = `<div class="error-box">${esc(errorText(e))}</div>`;
      }
    }

    // ---------- Ручной ввод: автоподсчёт суммы ----------
    function manualTotal() {
      const q = num($("quantity").value), p = num($("price").value);
      return q > 0 && p >= 0 ? round2(q * p) : 0;
    }
    function updateManualTotal() { $("manual-total").textContent = fmtMoney(manualTotal()); }

    function updateProductHint() {
      const p = stock.find((x) => String(x.id) === $("product").value);
      $("product-hint").textContent = p
        ? `${t("in_stock")}: ${fmtQty(p.quantity)} ${p.unit} · ${t("last_price")}: ${fmtMoney(p.price_per_unit)} / ${p.unit}`
        : "";
    }

    $("product").addEventListener("change", async () => {
      // «＋ Новый товар…» — создаём товар в справочнике сырья и сразу выбираем его
      if ($("product").value === "__new") {
        $("product").value = "";
        const created = await App.createProduct({ unit: $("unit").value });
        if (!created) return;
        await loadStock();
        $("product").value = String(created.id);
      }
      const p = stock.find((x) => String(x.id) === $("product").value);
      if (p) {
        if (UNITS.includes(p.unit)) $("unit").value = p.unit;
        if (!$("price").value && p.price_per_unit) $("price").value = p.price_per_unit; // подсказка: последняя цена
      }
      $("product").classList.remove("invalid");
      updateProductHint();
      updateManualTotal();
    });
    ["quantity", "price"].forEach((id) => $(id).addEventListener("input", () => { $(id).classList.remove("invalid"); updateManualTotal(); }));

    function validateManual() {
      const bad = [];
      if (!$("product").value) bad.push(["product", "product_required"]);
      if (!(num($("quantity").value) > 0)) bad.push(["quantity", "quantity_required"]);
      if (!(num($("price").value) >= 0) || $("price").value === "") bad.push(["price", "price_required"]);
      ["product", "quantity", "price"].forEach((id) => $(id).classList.toggle("invalid", bad.some(([b]) => b === id)));
      if (bad.length) { toast(t(bad[0][1]), "error"); return false; }
      return true;
    }

    /** Блокировка кнопок на время запроса. БАГ 1: прогресс именно через MainButton */
    function lock() {
      saving = true;
      if (mb) { mb.showProgress(false); mb.disable(); }
      $("save-manual").disabled = true; $("save-receipt").disabled = true;
    }
    function unlock() {
      saving = false;
      if (mb) { mb.hideProgress(); mb.enable(); }
      $("save-manual").disabled = false; $("save-receipt").disabled = false;
    }

    async function saveManual() {
      if (saving) return;                       // двойное нажатие — игнорируем
      if (!validateManual()) return;
      const product = stock.find((x) => String(x.id) === $("product").value);
      const payload = {
        product_id: Number($("product").value),
        quantity: num($("quantity").value),
        unit: $("unit").value,
        total_price: manualTotal(),
        payment_method: $("payment").value,
        date: $("date").value || App.today(),
      };
      const ok = await confirm(t("confirm_purchase", {
        product: esc(product ? product.name : ""), qty: fmtQty(payload.quantity), unit: esc(payload.unit), amount: fmtMoney(payload.total_price),
      }), { icon: "🛒", okLabel: t("save") });
      if (!ok || saving) return;

      lock();
      try {
        // БАГ 3: ждём ответ сервера; «сохранено» — только если api() не бросил ошибку
        const res = await api("/api/purchase", { json: payload });
        toast(`${t("purchase_saved")} · ${res.product_name} +${fmtQty(res.quantity)} ${res.unit}`);
        $("quantity").value = ""; $("price").value = "";
        updateManualTotal();
        await Promise.all([loadStock(), loadRecent(), loadShopping()]);
      } catch (e) {
        showError(e);                           // БАГ 2: 400 product_not_found → «Товар не найден в справочнике»
      } finally {
        unlock();                               // БАГ 1: кнопка разблокируется ВСЕГДА
      }
    }
    $("manual-form").addEventListener("submit", (ev) => { ev.preventDefault(); saveManual(); });

    // ---------- Фото чека: распознавание ----------
    $("upload").addEventListener("click", () => $("ai-file").click());

    $("ai-file").addEventListener("change", async () => {
      const file = $("ai-file").files[0];
      if (!file) return;
      const up = $("upload");
      up.disabled = true;
      up.querySelector(".u-icon").innerHTML = `<span class="spinner" style="width:36px;height:36px"></span>`;
      up.querySelector(".u-title").textContent = t("ai_processing");
      try {
        const form = new FormData();
        form.append("file", file);
        const res = await api("/api/parse-receipt", { form });
        // Отмечаем только позиции, которые сервер сопоставил со справочником.
        // Нераспознанные НЕ подставляются на другой товар (БАГ 2).
        aiItems = res.items.map((i) => ({ ...i, product_id: i.product_id || null, checked: Boolean(i.product_id), state: "pending", error: "" }));
        renderAiItems();
        $("ai-card").hidden = false;
        if (!aiItems.length) toast(t("nothing_found"), "warning");
      } catch (e) {
        showError(e); // 503 — ИИ недоступен, 429 — лимит, 502 — не удалось разобрать
      } finally {
        up.disabled = false;
        up.querySelector(".u-icon").textContent = "📸";
        up.querySelector(".u-title").textContent = t("ai_scan");
        $("ai-file").value = "";               // можно выбрать тот же файл ещё раз
      }
    });

    function selectedItems() { return aiItems.filter((i) => i.checked && i.product_id && i.state !== "added"); }

    function renderAiItems() {
      if (!aiItems.length) { $("ai-items").innerHTML = App.emptyHtml("🧾", "nothing_found"); updateReceiptFooter(); return; }
      $("ai-items").innerHTML = aiItems.map((i, idx) => {
        const done = i.state === "added";
        const options = `<option value="">${esc(t("not_matched"))}</option>` +
          (i.product_id ? "" : `<option value="__new">＋ ${esc(t("create_named", { name: i.name }))}</option>`) +
          stock.map((p) => `<option value="${p.id}" ${p.id === i.product_id ? "selected" : ""}>${esc(p.name)}</option>`).join("");
        return `
          <div class="check-item ${i.checked && !done ? "selected" : ""} ${done ? "done" : ""}">
            <label class="checkbox">
              <input type="checkbox" data-check="${idx}" ${i.checked ? "checked" : ""} ${!i.product_id || done ? "disabled" : ""} aria-label="${esc(i.name)}">
              <span class="box"></span>
            </label>
            <div style="min-width:0">
              <div class="title">${esc(i.name)}</div>
              <div class="meta">${fmtQty(i.quantity)} ${esc(i.unit)} · <b>${fmtMoney(i.total_price)}</b></div>
              ${done ? `<span class="badge ok" style="margin-top:8px">✅ ${esc(t("added"))}</span>`
                : `<select data-product="${idx}" class="${i.product_id ? "" : "invalid"}">${options}</select>`}
              ${i.error ? `<div class="small danger" style="margin-top:6px">${esc(i.error)}</div>` : ""}
            </div>
          </div>`;
      }).join("");
      updateReceiptFooter();
    }

    function updateReceiptFooter() {
      const sel = selectedItems();
      const total = sel.reduce((a, i) => a + i.total_price, 0);
      $("ai-total").textContent = fmtMoney(total);
      $("save-receipt-label").textContent = t("save_selected", { n: sel.length });
      if (activeTab === "photo") updateMainButton();
    }

    $("ai-items").addEventListener("change", async (ev) => {
      const c = ev.target.dataset.check, p = ev.target.dataset.product;
      if (c !== undefined) { aiItems[c].checked = ev.target.checked; }
      if (p !== undefined && ev.target.value === "__new") {
        // Товара из чека нет в справочнике — создаём его (название и единица из чека) и привязываем
        const item = aiItems[p];
        const created = await App.createProduct({ name: item.name, unit: UNITS.includes(item.unit) ? item.unit : "pcs" });
        if (created) {
          await loadStock();
          item.product_id = created.id; item.checked = true; item.error = "";
        }
        return renderAiItems();
      }
      if (p !== undefined) {
        const id = Number(ev.target.value) || null;
        aiItems[p].product_id = id;
        aiItems[p].checked = Boolean(id);      // выбрали товар вручную — отмечаем, сняли — снимаем
        aiItems[p].error = "";
      }
      renderAiItems();
    });

    async function saveReceipt() {
      if (saving) return;
      const items = selectedItems();
      if (!items.length) { toast(t("choose_items"), "error"); return; }
      const total = items.reduce((a, i) => a + i.total_price, 0);
      const ok = await confirm(t("confirm_receipt", { n: items.length, amount: fmtMoney(total) }), { icon: "🧾", okLabel: t("save") });
      if (!ok || saving) return;

      lock();
      let saved = 0;
      try {
        // Позиции сохраняются по одной: ошибка одной не теряет остальные
        for (const item of items) {
          try {
            await api("/api/purchase", { json: {
              product_id: item.product_id,
              quantity: item.quantity,
              unit: UNITS.includes(item.unit) ? item.unit : null,   // неизвестная единица → единица склада
              total_price: item.total_price,
              payment_method: $("payment").value,
              date: $("date").value || App.today(),
            } });
            item.state = "added"; item.checked = false; item.error = ""; saved += 1;
          } catch (e) {
            item.error = errorText(e);           // например «Товар не найден в справочнике»
          }
        }
        renderAiItems();
        toast(t("receipt_saved", { ok: saved, n: items.length }), saved === items.length ? "ok" : "error");
        await Promise.all([loadStock(), loadRecent(), loadShopping()]);
      } finally {
        unlock();
      }
    }
    $("save-receipt").addEventListener("click", saveReceipt);

    // ---------- ИИ-помощник: свободный чат ----------
    // История хранится в sessionStorage (на время открытия приложения) и целиком уходит на сервер:
    // так ИИ помнит контекст разговора. Сервер добавляет актуальные склад, рецепты и закупки.
    const CHAT_KEY = "kx_ai_chat";
    let chatHistory = [];
    try { chatHistory = JSON.parse(sessionStorage.getItem(CHAT_KEY) || "[]"); } catch (e) { chatHistory = []; }
    let chatBusy = false;

    /** Безопасный вывод ответа ИИ: экранируем HTML, затем **жирный** → <b> */
    function richText(s) {
      return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/^#+\s*/gm, "");
    }

    function renderChat(typing = false) {
      const log = $("chat-log");
      const hello = `
        <div class="ai-hello">
          <div class="ai-avatar">🤖</div>
          <h3>${esc(t("ai_hello_title"))}</h3>
          <div class="small">${esc(t("ai_hello_text"))}</div>
        </div>`;
      log.innerHTML = (chatHistory.length ? "" : hello) + chatHistory.map((m) => `
        <div class="bubble ${m.role === "user" ? "user" : "ai"} ${m.error ? "error" : ""}">${m.role === "user" ? esc(m.text) : `<span class="who">🤖 ${esc(t("ai_name"))}</span>${richText(m.text)}`}</div>`).join("")
        + (typing ? `<div class="bubble ai"><span class="typing"><i></i><i></i><i></i></span></div>` : "");
      log.scrollTop = log.scrollHeight;
      $("chat-suggestions").hidden = chatHistory.length > 0;
    }

    function renderSuggestions() {
      $("chat-suggestions").innerHTML = ["ai_q1", "ai_q2", "ai_q3", "ai_q4"].map((k) =>
        `<button type="button" class="chip" data-q="${esc(t(k))}">${esc(t(k))}</button>`).join("");
    }

    async function sendChat(text) {
      text = text.trim();
      if (!text || chatBusy) return;
      chatBusy = true;
      $("chat-send").disabled = true;
      chatHistory.push({ role: "user", text });
      $("chat-text").value = ""; autoGrow();
      renderChat(true);
      // Если Google перегружен, ответ может идти дольше — через 12 с говорим об этом под «…»
      const slowTimer = setTimeout(() => {
        const dots = document.querySelector("#chat-log .typing");
        if (dots) dots.insertAdjacentHTML("afterend", `<div class="small muted" style="margin-top:4px">${esc(t("ai_slow"))}</div>`);
      }, 12000);
      try {
        // Ошибки (503 — ИИ недоступен, 429 — лимит) не попадают в историю, которую видит модель
        const payload = chatHistory.filter((m) => !m.error).slice(-16).map(({ role, text }) => ({ role, text }));
        // Сервер сам ограничивает ответ ~50 с; приложение ждёт не дольше 70 с
        const res = await api("/api/ai/chat", { json: { messages: payload }, timeout: 70000 });
        chatHistory.push({ role: "assistant", text: res.answer });
      } catch (e) {
        // Понятные сообщения для чата вместо общих текстов про «распознавание»
        const text = e.status === 503 || e.status === 502 ? t("ai_busy")
          : e.status === 408 || e.status === 0 ? t("ai_timeout") : errorText(e);
        chatHistory.push({ role: "assistant", text, error: true });
      } finally {
        clearTimeout(slowTimer);
        chatBusy = false;
        $("chat-send").disabled = false;
        sessionStorage.setItem(CHAT_KEY, JSON.stringify(chatHistory.slice(-40)));
        renderChat();
      }
    }

    function autoGrow() {
      const ta = $("chat-text");
      ta.style.height = "auto";
      ta.style.height = Math.min(ta.scrollHeight, 140) + "px";
    }

    $("chat-form").addEventListener("submit", (ev) => { ev.preventDefault(); sendChat($("chat-text").value); });
    $("chat-text").addEventListener("input", autoGrow);
    $("chat-text").addEventListener("keydown", (ev) => {
      // Enter — отправить, Shift+Enter — новая строка (на телефоне Enter просто переносит строку)
      if (ev.key === "Enter" && !ev.shiftKey && !("ontouchstart" in window)) { ev.preventDefault(); sendChat($("chat-text").value); }
    });
    $("chat-suggestions").addEventListener("click", (ev) => {
      const b = ev.target.closest("[data-q]");
      if (b) sendChat(b.dataset.q);
    });

    // ---------- Что купить на неделю: из меню повара (потребность − остаток) ----------
    async function loadShopping() {
      try {
        const s = await api("/api/menu/shopping");
        const buy = s.items.filter((i) => i.to_buy > 0);
        $("shop-card").hidden = !s.items.length;
        $("shop-total").textContent = fmtMoney(s.estimate_total);
        $("shop").innerHTML = buy.map((i) => `
          <div class="list-item tappable" data-buy="${i.product_id}" data-qty="${i.to_buy}">
            <div class="lead">${App.CATEGORY_ICONS[i.category] || "🧺"}</div>
            <div class="grow"><div class="title">${esc(i.product)}</div>
              <div class="hint">${esc(t("need"))} ${fmtQty(i.need)} · ${esc(t("in_stock"))} ${fmtQty(i.have)} ${esc(i.unit)} · ≈ ${fmtMoney(i.estimate)}</div></div>
            <div class="amount text-warning">＋${fmtQty(i.to_buy)} ${esc(i.unit)}</div></div>`).join("")
          || `<p class="ok">${esc(t("shopping_all_in_stock"))}</p>`;
      } catch (e) { $("shop-card").hidden = true; }
    }
    // Нажатие на строку — заполняем форму ручной закупки этим товаром и количеством
    $("shop").addEventListener("click", (ev) => {
      const it = ev.target.closest("[data-buy]");
      if (!it) return;
      document.querySelector('.tabs [data-tab="manual"]').click();
      $("product").value = it.dataset.buy;
      $("product").dispatchEvent(new Event("change"));
      $("quantity").value = it.dataset.qty;
      $("quantity").dispatchEvent(new Event("input"));
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    // ---------- Главная кнопка Telegram / своя кнопка ----------
    function updateMainButton() {
      if (!mb) {
        $("save-manual").hidden = activeTab !== "manual";
        $("save-receipt").hidden = activeTab !== "photo";
        return;
      }
      if (activeTab === "manual") { mb.setText("💾 " + t("save_purchase")); mb.show(); }
      else if (activeTab === "photo" && aiItems.length) { mb.setText("💾 " + t("save_selected", { n: selectedItems().length })); mb.show(); }
      else mb.hide();                            // в чате с ИИ главная кнопка не нужна
    }

    if (mb) mb.onClick(() => (activeTab === "manual" ? saveManual() : activeTab === "photo" ? saveReceipt() : null));

    // ---------- Запуск ----------
    $("date").value = App.today();
    updateManualTotal();
    renderSuggestions();
    renderChat();
    App.initTabs((tab) => {
      activeTab = ["photo", "ai"].includes(tab) ? tab : "manual";
      updateMainButton();
      if (tab === "ai") setTimeout(() => { $("chat-log").scrollTop = $("chat-log").scrollHeight; }, 50);
    });
    loadStock();
    loadRecent();
    loadShopping();
  </script>
</body>
</html>
